# Untuk development lokal saja (bukan untuk production/Render)
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:10000"
    volumes:
      - .:/app
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite
