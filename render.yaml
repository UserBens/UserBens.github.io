# render.yaml — deploy otomatis ke Render.com (free tier, tanpa kartu kredit)
# Cara pakai: hubungkan repo GitHub ini di dashboard Render > New > Blueprint,
# Render akan otomatis membaca file ini.

services:
  - type: web
    name: laravel-portfolio
    runtime: docker
    plan: free
    branch: main
    autoDeploy: false   # dimatikan sengaja — deploy dipicu oleh GitHub Actions (ci-cd.yml) setelah test lolos
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /app/database/database.sqlite
      - key: APP_KEY
        generateValue: true
